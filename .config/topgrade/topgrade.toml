[brew]
autoremove = true

[git]
repos = ["~/.config/dotfiles"]
arguments = "--rebase --autostash"
fallback_to_fetch_default = true

[misc]
ask_retry = false
assume_yes = true
cleanup = true
disable = [
  "bin",
  "bun",
  "bun_packages",
  "cargo",
  "claude_code",
  "claude_code_plugins",
  "codex",
  "colima",
  "containers",
  "github_cli_extensions",
  "github_cli_skills",
  "node",
  "opencode",
  "pi",
  "pip3",
  "pnpm",
  "rustup",
  "tailscale",
  "tmux",
  "vim",
  "vite_plus",
]
no_self_update = true
notify_end = "never"
pre_sudo = true

[vscode]
cleanup_obsolete_extensions = true

[windows]
accept_all_updates = true
