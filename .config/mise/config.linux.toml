[bootstrap.packages]
'apt:git' = 'latest'
'apt:gnupg' = 'latest'
'apt:vim' = 'latest'
'apt:zsh' = 'latest'

[dotfiles]
'~/.config/fontconfig/fonts.conf' = {}
'~/.config/hypr/hyprland.lua' = {}
'~/.config/mimeapps.list' = {}
'~/.config/noctalia/config.toml' = {}
'~/.config/user-dirs.*' = {}
'~/.config/uwsm/env' = {}
'~/.local/share/applications/*' = '~/.config/dotfiles/.local/share/applications/*'
