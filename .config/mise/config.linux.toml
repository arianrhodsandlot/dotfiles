[bootstrap.packages]
'apt:git' = 'latest'
'apt:gnupg' = 'latest'
'apt:vim' = 'latest'
'apt:zsh' = 'latest'

[dotfiles]
'~/.config/fontconfig/fonts.conf' = {}
'~/.config/hypr' = {}
'~/.config/mimeapps.list' = {}
'~/.config/noctalia' = {}
'~/.config/user-dirs.*' = {}
'~/.config/uwsm' = {}
'~/.local/share/applications' = { mode = 'symlink-each' }
