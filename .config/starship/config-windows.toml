"$schema" = 'https://starship.rs/config-schema.json'

format = '[#](blue) $all$line_break$character'
command_timeout = 5000

[username]
show_always = true
style_user = 'bold cyan'

[hostname]
ssh_only = false

[localip]
ssh_only = true
disabled = false

[shlvl]
disabled = false
threshold = 2

[directory]
truncation_length = 10
truncate_to_repo = false

[git_metrics]
disabled = true

[git_status]
disabled = true

[git_state]
disabled = true

[git_branch]
disabled = true

[git_commit]
disabled = true

[memory_usage]
disabled = false

[sudo]
disabled = false

[time]
disabled = false

[status]
map_symbol = true
disabled = false

[shell]
disabled = false
